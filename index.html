<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal English University: a progressive B1+ to C1 English course with grammar, vocabulary, reading, listening, writing, speaking and projects.">
    <meta name="theme-color" content="#0b7a68">
    <title>English Lab · Personal English University</title>
    <link rel="stylesheet" href="styles.css">
    <script src="curriculum.js" defer></script>
    <script src="catalogs.js" defer></script>
    <script src="activity-expansion.js" defer></script>
    <script src="university-practice.js" defer></script>
    <script src="university-depth.js" defer></script>
    <script src="partial1.js" defer></script>
    <script src="exercises.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="home" aria-label="Go to the course home">
          <span class="brand-mark" aria-hidden="true">EL</span>
          <span><strong>English Lab</strong><small>Personal English University</small></span>
        </button>
        <button class="menu-button" type="button" data-action="menu" aria-expanded="false" aria-controls="main-nav">
          <span></span><span></span><span></span><span class="sr-only">Open menu</span>
        </button>
        <nav class="nav" id="main-nav" aria-label="Main navigation">
          <button type="button" data-action="home">Topics</button>
          <button type="button" data-action="university">University</button>
          <button type="button" data-action="skills">Skills</button>
          <button type="button" data-action="all-practice">All practice</button>
          <button type="button" data-action="partial-1-test">Partial 1 test</button>
          <button type="button" data-action="partial-2-test">Partial 2 test</button>
          <button type="button" data-action="diagnostic">Diagnostic</button>
          <button type="button" data-action="mistakes">My mistakes <span class="nav-count">0</span></button>
          <button type="button" data-action="theme" aria-label="Toggle dark mode">Dark mode</button>
        </nav>
      </header>
      <main id="app" tabindex="-1"></main>
      <footer>
        <p>English Lab · B1+ → C1 · Grammar, skills and projects</p>
        <button type="button" data-action="reset">Reset progress</button>
      </footer>
    </div>
    <noscript>You need JavaScript enabled to use the interactive exercises.</noscript>
  </body>
</html>
